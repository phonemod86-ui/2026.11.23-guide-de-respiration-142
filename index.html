<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1:4:2 呼吸引导 · Breathing Guide · Guide Respiratoire</title>
  <!-- 引入 Tailwind CSS 以实现现代响应式布局 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Google Fonts Inter 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* 全局基础样式与禅意深色主题 */
    :root {
      --bg-deep: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.72);
      --accent-inhale: #38bdf8;   /* 吸气：清澈天蓝 */
      --accent-hold: #a78bfa;     /* 憋气：宁静紫罗兰 */
      --accent-exhale: #34d399;   /* 呼气：柔和翠绿 */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, #0b1120 75%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* 玻璃拟态卡片 */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.55);
    }

    /* 呼吸圆环容器与动画 */
    .breath-stage {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .breath-stage {
        width: 270px;
        height: 270px;
      }
    }

    /* 外圈光晕 */
    .breath-halo {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(56, 189, 248, 0) 70%);
      transform: scale(0.65);
      transition: transform 0.3s ease-out, background 0.5s ease;
      pointer-events: none;
    }

    /* 核心呼吸动态圆球 */
    .breath-orb {
      width: 190px;
      height: 190px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(14, 165, 233, 0.14));
      border: 3px solid rgba(56, 189, 248, 0.75);
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.3), inset 0 0 24px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: scale(0.62);
      will-change: transform;
      position: relative;
      z-index: 2;
    }

    @media (min-width: 640px) {
      .breath-orb {
        width: 215px;
        height: 215px;
      }
    }

    /* 憋气阶段轻微呼吸脉动动画 */
    @keyframes holdPulse {
      0%, 100% {
        box-shadow: 0 0 42px rgba(167, 139, 250, 0.45), inset 0 0 28px rgba(255, 255, 255, 0.18);
      }
      50% {
        box-shadow: 0 0 60px rgba(167, 139, 250, 0.72), inset 0 0 36px rgba(255, 255, 255, 0.28);
      }
    }

    .orb-holding {
      animation: holdPulse 2s ease-in-out infinite;
    }

    /* 自定义大尺寸滑块（方便鼠标和手指顺滑拖动） */
    input[type="range"].custom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 9999px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.55);
      cursor: grab;
      transition: transform 0.15s ease;
    }

    input[type="range"].custom-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    input[type="range"].custom-slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.55);
      cursor: grab;
    }

    /* 音量小滑块 */
    input[type="range"].mini-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].mini-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 2px solid #38bdf8;
      cursor: pointer;
    }

    /* 按钮按压反馈 */
    .btn-press {
      transition: transform 0.12s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .btn-press:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- 顶部导航栏：标题与右上角三语切换器 -->
  <header class="w-full max-w-2xl flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
    <div class="text-center sm:text-left">
      <h1 id="app-title" class="text-xl sm:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-sky-300 via-indigo-300 to-emerald-300 bg-clip-text text-transparent">
        1:4:2 呼吸引导
      </h1>
      <p id="app-subtitle" class="text-xs sm:text-sm text-slate-400 mt-0.5">
        源自《人生的四大秘密》 · 呼吸的秘密
      </p>
    </div>

    <!-- 右上角三语选择按钮组 -->
    <div class="glass-card rounded-2xl p-1.5 flex items-center gap-1" role="group" aria-label="Language Selector">
      <button type="button" data-lang="zh" class="lang-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all bg-sky-500 text-white shadow">
        🇨🇳 中文
      </button>
      <button type="button" data-lang="en" class="lang-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-300 hover:text-white">
        🇬🇧 English
      </button>
      <button type="button" data-lang="fr" class="lang-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-300 hover:text-white">
        🇫🇷 Français
      </button>
    </div>
  </header>

  <!-- 主训练卡片区域 -->
  <main class="w-full max-w-2xl glass-card rounded-3xl p-5 sm:p-8 flex flex-col items-center gap-6">

    <!-- 顶部状态栏：当前轮数统计 & 1:4:2 时长概览 -->
    <div class="w-full flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 border border-slate-700/50 rounded-2xl px-4 py-3">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="cycle-label" class="text-xs sm:text-sm text-slate-300 font-medium">已完成轮数</span>
        <span id="cycle-count" class="text-lg sm:text-xl font-extrabold text-emerald-400 ml-1">0</span>
      </div>

      <!-- 三阶段实时秒数预览徽章 -->
      <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold">
        <span id="badge-inhale" class="px-2.5 py-1 rounded-lg bg-sky-500/15 text-sky-300 border border-sky-400/30">
          吸气 2s
        </span>
        <span id="badge-hold" class="px-2.5 py-1 rounded-lg bg-violet-500/15 text-violet-300 border border-violet-400/30">
          憋气 8s
        </span>
        <span id="badge-exhale" class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-400/30">
          呼气 4s
        </span>
      </div>
    </div>

    <!-- 中央动态呼吸圆环与读秒数字 -->
    <div class="flex flex-col items-center justify-center my-1">
      <div class="breath-stage">
        <div id="breath-halo" class="breath-halo"></div>
        <div id="breath-orb" class="breath-orb">
          <!-- 当前阶段名称（吸气 / 憋气 / 呼气） -->
          <span id="phase-title" class="text-2xl sm:text-3xl font-extrabold tracking-wide text-white drop-shadow">
            准备开始
          </span>
          <!-- 语音提示状态提示小字 -->
          <span id="voice-cue-badge" class="text-xs font-medium text-sky-200/90 mt-1 h-4">
            点击下方开始
          </span>
        </div>
      </div>

      <!-- 读秒大数字显示区 -->
      <div class="mt-3 flex flex-col items-center w-full max-w-md">
        <div class="flex items-baseline gap-2">
          <span id="timer-number" class="text-5xl sm:text-6xl font-black tabular-nums tracking-tight text-white">
            0
          </span>
          <span id="timer-unit" class="text-base sm:text-lg font-semibold text-slate-400">
            秒
          </span>
        </div>

        <!-- 加粗进度条（16px 高度，高对比度，清晰易观察） -->
        <div class="w-64 sm:w-80 h-4 bg-slate-900/90 rounded-full overflow-hidden border border-slate-700/80 p-0.5 mt-3 shadow-inner">
          <div id="phase-progress-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-sky-400 to-indigo-400 transition-none"></div>
        </div>
      </div>
    </div>

    <!-- 核心控制按钮区：开始 / 暂停 / 结束重置 -->
    <div class="w-full grid grid-cols-2 sm:grid-cols-3 gap-3">
      <button id="btn-start" type="button" class="btn-press col-span-2 sm:col-span-1 py-3.5 px-5 rounded-2xl font-bold text-base bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2">
        <span>▶</span>
        <span id="btn-start-text">开始训练</span>
      </button>

      <button id="btn-pause" type="button" disabled class="btn-press py-3.5 px-5 rounded-2xl font-bold text-base bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none text-amber-300 border border-slate-600/60 flex items-center justify-center gap-2">
        <span>⏸</span>
        <span id="btn-pause-text">暂停</span>
      </button>

      <button id="btn-reset" type="button" class="btn-press py-3.5 px-5 rounded-2xl font-bold text-base bg-slate-800 hover:bg-slate-700 text-rose-300 border border-slate-600/60 flex items-center justify-center gap-2">
        <span>⏹</span>
        <span id="btn-reset-text">结束重置</span>
      </button>
    </div>

    <!-- 鼠标/触摸调节单位时间滑块区（1.0s - 6.0s，步进 0.5s） -->
    <div class="w-full bg-slate-900/55 border border-slate-700/60 rounded-2xl p-4 sm:p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <label for="unit-slider" id="unit-label" class="text-sm sm:text-base font-bold text-slate-200">
          单位时间调节 (1 单位)
        </label>
        <div class="flex items-center gap-2">
          <!-- 微调减号按钮 -->
          <button id="btn-unit-dec" type="button" aria-label="Decrease unit time" class="btn-press w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold flex items-center justify-center">
            −
          </button>
          <span id="unit-value-display" class="min-w-[64px] text-center text-lg sm:text-xl font-extrabold text-sky-400 tabular-nums">
            2.0 s
          </span>
          <!-- 微调加号按钮 -->
          <button id="btn-unit-inc" type="button" aria-label="Increase unit time" class="btn-press w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold flex items-center justify-center">
            +
          </button>
        </div>
      </div>

      <!-- 滑动条控件 -->
      <input id="unit-slider" type="range" min="1" max="6" step="0.5" value="2" class="custom-slider my-1" />

      <!-- 刻度参考标签 -->
      <div class="flex justify-between text-xs text-slate-400 font-medium px-1 select-none">
        <span>1.0s</span>
        <span>2.0s</span>
        <span>3.0s</span>
        <span>4.0s</span>
        <span>5.0s</span>
        <span>6.0s</span>
      </div>
    </div>

    <!-- 语音与音量控制面板 -->
    <div class="w-full bg-slate-900/55 border border-slate-700/60 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- 开关：阶段语音提示 & 读秒语音播报 -->
      <div class="flex flex-wrap items-center gap-4 w-full sm:w-auto justify-between sm:justify-start">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <input id="toggle-cue-voice" type="checkbox" checked class="w-4 h-4 accent-sky-500 rounded cursor-pointer" />
          <span id="label-cue-voice" class="text-xs sm:text-sm font-medium text-slate-200">阶段语音提示</span>
        </label>

        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <input id="toggle-count-voice" type="checkbox" checked class="w-4 h-4 accent-sky-500 rounded cursor-pointer" />
          <span id="label-count-voice" class="text-xs sm:text-sm font-medium text-slate-200">读秒语音 (2起)</span>
        </label>
      </div>

      <!-- 音量调节与语音测试按钮（适配 iOS Safari 解锁语音） -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <div class="flex items-center gap-2">
          <span class="text-sm" aria-hidden="true">🔊</span>
          <input id="volume-slider" type="range" min="0" max="1" step="0.1" value="1" class="mini-slider w-24" aria-label="Volume" />
        </div>

        <button id="btn-test-voice" type="button" class="btn-press px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-600/70">
          测试语音
        </button>
      </div>
    </div>

  </main>

  <!-- 底部温和提示与规则说明 -->
  <footer class="w-full max-w-2xl mt-4 text-center text-xs text-slate-400 space-y-1 px-2">
    <p id="footer-rule">
      规则：先语音播报阶段指令，播报完成后开始读秒（从 2 读到该阶段结束），随后自动进入下一阶段。
    </p>
    <p id="footer-safety" class="text-slate-500">
      温馨提示：憋气请以身体舒适为前提，切勿勉强屏息。在 iPhone / iPad 上请确保关闭侧面静音键并调大媒体音量。
    </p>
  </footer>

  <!-- 状态提示浮层（替代 alert） -->
  <div id="toast-box" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800/95 text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-2xl border border-slate-600 shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  </div>

  <script>
    /**
     * ============================================================================
     * 1:4:2 三语呼吸引导应用核心逻辑 (简体中文 / English / Français)
     * 特性：
     * 1. 严格遵循 1:4:2 呼吸比例（吸气 1 单位，憋气 4 单位，呼气 2 单位）。
     * 2. 每阶段先完整播报阶段名称（如“吸气”），播报完成后（onend）才开始读秒与进度动画。
     * 3. 读秒从 2 开始播报至该阶段总秒数（例如 8 秒阶段：依次播报 2, 3, 4, 5, 6, 7, 8）。
     * 4. 针对 iOS Safari 做了语音解锁、onend 超时兜底以及防止语音对象被垃圾回收的处理。
     * ============================================================================
     */

    // 1. 多语言字典配置
    const I18N = {
      zh: {
        langCode: 'zh-CN',
        appTitle: '1:4:2 呼吸引导',
        appSubtitle: '源自《人生的四大秘密》 · 呼吸的秘密',
        cycleLabel: '已完成轮数',
        readyTitle: '准备开始',

        speakingCueHint: '语音引导中...',

        pausedTitle: '已暂停',
        pausedHint: '点击继续训练',
        phases: {
          inhale: { label: '吸气', speak: '吸气' },
          hold:   { label: '憋气', speak: '憋气' },
          exhale: { label: '呼气', speak: '呼气' }
        },
        timerUnit: '秒',
        btnStart: '开始训练',
        btnResume: '继续训练',
        btnPause: '暂停',
        btnReset: '结束重置',
        unitLabel: '单位时间调节 (1 单位)',
        cueVoiceLabel: '阶段语音提示',
        countVoiceLabel: '读秒语音 (2起)',
        testVoiceBtn: '测试语音',
        testVoicePhrase: '吸气，憋气，呼气，语音正常',
        footerRule: '规则：先语音播报阶段指令，播报完成后开始读秒（从 2 读到该阶段结束），随后自动进入下一阶段。',
        footerSafety: '温馨提示：憋气请以身体舒适为前提，切勿勉强屏息。iPhone / iPad 请确保关闭静音键。',
        toastNoSpeech: '当前浏览器不支持系统语音播报，将使用纯视觉引导。'
      },
      en: {
        langCode: 'en-US',
        appTitle: '1:4:2 Breathing Guide',
        appSubtitle: 'Inspired by "The Four Secrets of Life"',
        cycleLabel: 'Completed Cycles',
        readyTitle: 'Ready',
        readyHint: 'Press Start below',
        speakingCueHint: 'Voice cue...',
        countingHint: 'Follow the rhythm',
        pausedTitle: 'Paused',
        pausedHint: 'Press Resume to continue',
        phases: {
          inhale: { label: 'Inhale', speak: 'Inhale' },
          hold:   { label: 'Hold',   speak: 'Hold' },
          exhale: { label: 'Exhale', speak: 'Exhale' }
        },
        timerUnit: 'sec',
        btnStart: 'Start',
        btnResume: 'Resume',
        btnPause: 'Pause',
        btnReset: 'Reset',
        unitLabel: 'Base Unit Time (1 Unit)',
        cueVoiceLabel: 'Phase Voice Cue',
        countVoiceLabel: 'Count Voice (from 2)',
        testVoiceBtn: 'Test Voice',
        testVoicePhrase: 'Inhale, Hold, Exhale. Voice is ready.',
        footerRule: 'Flow: Speaks the phase cue first, then starts counting from 2 up to the phase duration.',
        footerSafety: 'Note: Never force breath holding; stay comfortable. On iPhone/iPad, turn off silent mode.',
        toastNoSpeech: 'Web Speech API is not supported in this browser. Running in visual mode.'
      },
      fr: {
        langCode: 'fr-FR',
        appTitle: 'Guide Respiratoire 1:4:2',
        appSubtitle: 'Inspiré des « Quatre Secrets de la Vie »',
        cycleLabel: 'Cycles Terminés',
        readyTitle: 'Prêt',
        readyHint: 'Appuyez sur Démarrer',
        speakingCueHint: 'Annonce vocale...',
        countingHint: 'Suivez le rythme',
        pausedTitle: 'En Pause',
        pausedHint: 'Appuyez sur Reprendre',
        phases: {
          inhale: { label: 'Inspirer', speak: 'Inspirer' },
          hold:   { label: 'Retenir',  speak: 'Retenir' },
          exhale: { label: 'Expirer',  speak: 'Expirer' }
        },
        timerUnit: 'sec',
        btnStart: 'Démarrer',
        btnResume: 'Reprendre',
        btnPause: 'Pause',
        btnReset: 'Réinitialiser',
        unitLabel: 'Temps de Base (1 Unité)',
        cueVoiceLabel: 'Annonce de phase',
        countVoiceLabel: 'Décompte vocal (dès 2)',
        testVoiceBtn: 'Tester la voix',
        testVoicePhrase: 'Inspirer, Retenir, Expirer. La voix fonctionne.',
        footerRule: 'Règle : Annonce vocale de la phase d’abord, puis décompte à partir de 2 jusqu’à la fin.',
        footerSafety: 'Conseil : Restez toujours à l’aise pendant la rétention. Sur iPhone/iPad, désactivez le mode silencieux.',
        toastNoSpeech: 'Synthèse vocale non prise en charge par ce navigateur. Mode visuel actif.'
      }
    };

    // 2. 应用全局状态
    const state = {
      lang: 'zh',               // 当前语言：'zh' | 'en' | 'fr'
      unitTime: 2.0,            // 基础单位时间（1.0 ~ 6.0 秒）
      isRunning: false,         // 是否正在运行
      isPaused: false,          // 是否处于暂停状态
      phaseIndex: 0,            // 0: inhale(吸气), 1: hold(憋气), 2: exhale(呼气)
      cycles: 0,                // 已完成完整呼吸轮数
      isSpeakingCue: false,     // 当前是否正在播报阶段名称（未开始读秒前）
      phaseDuration: 2,         // 当前阶段的总秒数（支持 0.5 精度计算与整数读秒）
      phaseStartTime: 0,        // 当前阶段读秒开始的时间戳
      pausedElapsed: 0,         // 暂停时已流逝的毫秒数
      lastSpokenSecond: 1,      // 记录上次播报的数字（从 2 开始）
      rafId: null,              // requestAnimationFrame 句柄
      cueFallbackTimer: null,   // 防止 iOS Safari 语音 onend 不触发的保险定时器
      activeUtterances: [],     // 防止 Chrome/Safari 提前回收 SpeechSynthesisUtterance 对象
      voices: []                // 缓存系统可用语音列表
    };

    const PHASE_ORDER = ['inhale', 'hold', 'exhale'];
    const PHASE_MULTIPLIERS = { inhale: 1, hold: 4, exhale: 2 };

    // 3. DOM 元素缓存
    const els = {
      langBtns: document.querySelectorAll('.lang-btn'),
      appTitle: document.getElementById('app-title'),
      appSubtitle: document.getElementById('app-subtitle'),
      cycleLabel: document.getElementById('cycle-label'),
      cycleCount: document.getElementById('cycle-count'),
      badgeInhale: document.getElementById('badge-inhale'),
      badgeHold: document.getElementById('badge-hold'),
      badgeExhale: document.getElementById('badge-exhale'),
      breathHalo: document.getElementById('breath-halo'),
      breathOrb: document.getElementById('breath-orb'),
      phaseTitle: document.getElementById('phase-title'),
      voiceCueBadge: document.getElementById('voice-cue-badge'),
      timerNumber: document.getElementById('timer-number'),
      timerUnit: document.getElementById('timer-unit'),
      progressBar: document.getElementById('phase-progress-bar'),
      btnStart: document.getElementById('btn-start'),
      btnStartText: document.getElementById('btn-start-text'),
      btnPause: document.getElementById('btn-pause'),
      btnPauseText: document.getElementById('btn-pause-text'),
      btnReset: document.getElementById('btn-reset'),
      btnResetText: document.getElementById('btn-reset-text'),
      unitLabel: document.getElementById('unit-label'),
      unitSlider: document.getElementById('unit-slider'),
      unitValueDisplay: document.getElementById('unit-value-display'),
      btnUnitDec: document.getElementById('btn-unit-dec'),
      btnUnitInc: document.getElementById('btn-unit-inc'),
      toggleCueVoice: document.getElementById('toggle-cue-voice'),
      labelCueVoice: document.getElementById('label-cue-voice'),
      toggleCountVoice: document.getElementById('toggle-count-voice'),
      labelCountVoice: document.getElementById('label-count-voice'),
      volumeSlider: document.getElementById('volume-slider'),
      btnTestVoice: document.getElementById('btn-test-voice'),
      footerRule: document.getElementById('footer-rule'),
      footerSafety: document.getElementById('footer-safety'),
      toastBox: document.getElementById('toast-box')
    };

    // 4. 轻量级 Toast 提示（严禁使用 alert）
    let toastTimer = null;
    function showToast(msg) {
      els.toastBox.textContent = msg;
      els.toastBox.classList.remove('opacity-0');
      els.toastBox.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toastBox.classList.remove('opacity-100');
        els.toastBox.classList.add('opacity-0');
      }, 3200);
    }

    // 5. 初始化语音引擎并加载系统语音列表
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      state.voices = window.speechSynthesis.getVoices() || [];
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    /**
     * 根据当前选择的语言选择最佳语音引擎
     */
    function getBestVoice(langCode) {
      if (!state.voices.length) loadVoices();
      const prefix = langCode.split('-')[0].toLowerCase();
      // 优先精确匹配 (如 zh-CN, en-US, fr-FR)
      let match = state.voices.find(v => v.lang.toLowerCase() === langCode.toLowerCase());
      // 其次匹配语言前缀 (如 zh, en, fr)
      if (!match) {
        match = state.voices.find(v => v.lang.toLowerCase().startsWith(prefix));
      }
      return match || null;
    }

    /**
     * 封装 Web Speech API 播报函数
     * @param {string} text - 要朗读的文本
     * @param {object} options - { rate, onComplete }
     */
    function speakText(text, { rate = 1.05, onComplete = null } = {}) {
      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }

      const vol = parseFloat(els.volumeSlider.value);
      if (vol <= 0) {
        if (onComplete) onComplete();
        return;
      }

      try {
        // 清理上一段未完成的语音，避免堆积延迟
        window.speechSynthesis.cancel();

        const dict = I18N[state.lang];
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = dict.langCode;
        utterance.volume = vol;
        utterance.rate = rate;
        utterance.pitch = 1.0;

        const bestVoice = getBestVoice(dict.langCode);
        if (bestVoice) {
          utterance.voice = bestVoice;
        }

        // 保存引用防止垃圾回收导致 onend 丢失
        state.activeUtterances.push(utterance);

        let finished = false;
        const done = () => {
          if (finished) return;
          finished = true;
          clearTimeout(state.cueFallbackTimer);
          state.activeUtterances = state.activeUtterances.filter(u => u !== utterance);
          if (onComplete) onComplete();
        };

        utterance.onend = done;
        utterance.onerror = done;

        // 兜底保护：如果某些手机浏览器未正常触发 onend，按字数估算最长等待时间后继续执行
        if (onComplete) {
          const estimatedMs = Math.max(950, text.length * 320 + 450);
          state.cueFallbackTimer = setTimeout(done, estimatedMs);
        }

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        if (onComplete) onComplete();
      }
    }

    // 6. 格式化数字显示（整数不带小数点，半秒显示 .5）
    function formatSec(val) {
      return Number.isInteger(val) ? `${val}` : `${val.toFixed(1)}`;
    }

    // 7. 刷新界面语言文本与各阶段时间预览
    function updateUI() {
      const dict = I18N[state.lang];
      document.documentElement.lang = dict.langCode;

      // 更新语言按钮高亮样式
      els.langBtns.forEach(btn => {
        const active = btn.dataset.lang === state.lang;
        if (active) {
          btn.className = 'lang-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all bg-sky-500 text-white shadow';
        } else {
          btn.className = 'lang-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-300 hover:text-white';
        }
      });

      // 更新静态标签
      els.appTitle.textContent = dict.appTitle;
      els.appSubtitle.textContent = dict.appSubtitle;
      els.cycleLabel.textContent = dict.cycleLabel;
      els.timerUnit.textContent = dict.timerUnit;
      els.btnPauseText.textContent = dict.btnPause;
      els.btnResetText.textContent = dict.btnReset;
      els.unitLabel.textContent = dict.unitLabel;
      els.labelCueVoice.textContent = dict.cueVoiceLabel;
      els.labelCountVoice.textContent = dict.countVoiceLabel;
      els.btnTestVoice.textContent = dict.testVoiceBtn;
      els.footerRule.textContent = dict.footerRule;
      els.footerSafety.textContent = dict.footerSafety;

      // 更新开始/继续按钮文字
      els.btnStartText.textContent = state.isPaused ? dict.btnResume : dict.btnStart;

      // 计算 1:4:2 三个阶段的具体秒数
      const dInhale = state.unitTime * PHASE_MULTIPLIERS.inhale;
      const dHold = state.unitTime * PHASE_MULTIPLIERS.hold;
      const dExhale = state.unitTime * PHASE_MULTIPLIERS.exhale;

      els.unitValueDisplay.textContent = `${state.unitTime.toFixed(1)} s`;
      els.badgeInhale.textContent = `${dict.phases.inhale.label} ${formatSec(dInhale)}s`;
      els.badgeHold.textContent = `${dict.phases.hold.label} ${formatSec(dHold)}s`;
      els.badgeExhale.textContent = `${dict.phases.exhale.label} ${formatSec(dExhale)}s`;

      // 如果当前未运行且未暂停，刷新待机提示
      if (!state.isRunning && !state.isPaused) {
        els.phaseTitle.textContent = dict.readyTitle;
        els.voiceCueBadge.textContent = dict.readyHint;
      } else if (state.isPaused) {
        els.phaseTitle.textContent = dict.pausedTitle;
        els.voiceCueBadge.textContent = dict.pausedHint;
      } else {
        const currentKey = PHASE_ORDER[state.phaseIndex];
        els.phaseTitle.textContent = dict.phases[currentKey].label;
        els.voiceCueBadge.textContent = state.isSpeakingCue ? dict.speakingCueHint : dict.countingHint;
      }
    }

    // 8. 应用不同呼吸阶段的视觉配色与圆球样式
    function applyPhaseTheme(phaseKey) {
      els.breathOrb.classList.remove('orb-holding');

      if (phaseKey === 'inhale') {
        els.breathOrb.style.background = 'linear-gradient(135deg, rgba(56, 189, 248, 0.36), rgba(14, 165, 233, 0.16))';
        els.breathOrb.style.borderColor = 'rgba(56, 189, 248, 0.85)';
        els.breathOrb.style.boxShadow = '0 0 38px rgba(56, 189, 248, 0.35), inset 0 0 24px rgba(255, 255, 255, 0.14)';
        els.breathHalo.style.background = 'radial-gradient(circle, rgba(56, 189, 248, 0.28) 0%, rgba(56, 189, 248, 0) 70%)';
        els.progressBar.className = 'h-full rounded-full bg-gradient-to-r from-sky-400 to-cyan-300';
      } else if (phaseKey === 'hold') {
        els.breathOrb.style.background = 'linear-gradient(135deg, rgba(167, 139, 250, 0.38), rgba(139, 92, 246, 0.18))';
        els.breathOrb.style.borderColor = 'rgba(167, 139, 250, 0.9)';
        els.breathOrb.classList.add('orb-holding');
        els.breathHalo.style.background = 'radial-gradient(circle, rgba(167, 139, 250, 0.3) 0%, rgba(167, 139, 250, 0) 70%)';
        els.progressBar.className = 'h-full rounded-full bg-gradient-to-r from-violet-400 to-fuchsia-400';
      } else {
        els.breathOrb.style.background = 'linear-gradient(135deg, rgba(52, 211, 153, 0.36), rgba(16, 185, 129, 0.16))';
        els.breathOrb.style.borderColor = 'rgba(52, 211, 153, 0.85)';
        els.breathOrb.style.boxShadow = '0 0 38px rgba(52, 211, 153, 0.35), inset 0 0 24px rgba(255, 255, 255, 0.14)';
        els.breathHalo.style.background = 'radial-gradient(circle, rgba(52, 211, 153, 0.28) 0%, rgba(52, 211, 153, 0) 70%)';
        els.progressBar.className = 'h-full rounded-full bg-gradient-to-r from-emerald-400 to-teal-300';
      }
    }

    // 9. 启动指定呼吸阶段（核心逻辑：先播报指令，完成后再开始读秒与动画）
    function startPhase(index) {
      if (!state.isRunning || state.isPaused) return;

      state.phaseIndex = index;
      const phaseKey = PHASE_ORDER[index];
      const dict = I18N[state.lang];

      // 计算当前阶段时长（秒）
      state.phaseDuration = state.unitTime * PHASE_MULTIPLIERS[phaseKey];
      state.pausedElapsed = 0;
      state.lastSpokenSecond = 1; // 准备从 2 开始读秒
      state.isSpeakingCue = true;

      // 更新界面视觉主题与文字
      applyPhaseTheme(phaseKey);
      els.phaseTitle.textContent = dict.phases[phaseKey].label;
      els.voiceCueBadge.textContent = dict.speakingCueHint;
      els.timerNumber.textContent = '1';
      els.progressBar.style.width = '0%';

      // 设置阶段初始圆球大小（吸气从小开始，憋气与呼气从最大开始）
      if (phaseKey === 'inhale') {
        els.breathOrb.style.transform = 'scale(0.62)';
        els.breathHalo.style.transform = 'scale(0.65)';
      } else {
        els.breathOrb.style.transform = 'scale(1.05)';
        els.breathHalo.style.transform = 'scale(1.12)';
      }

      // 定义语音播报完成后的回调：正式开启本阶段的计时与读秒
      const beginCountingPhase = () => {
        if (!state.isRunning || state.isPaused) return;
        state.isSpeakingCue = false;
        els.voiceCueBadge.textContent = dict.countingHint;
        state.phaseStartTime = performance.now();
        state.lastSpokenSecond = 1; // 确保第 2 秒到达时触发播报 "2"
        cancelAnimationFrame(state.rafId);
        state.rafId = requestAnimationFrame(tickPhaseLoop);
      };

      // 判断是否开启“阶段语音提示”
      if (els.toggleCueVoice.checked) {
        speakText(dict.phases[phaseKey].speak, {
          rate: 1.0,
          onComplete: beginCountingPhase
        });
      } else {
        // 若关闭了阶段提示音，短暂延迟 250ms 后直接进入读秒
        state.cueFallbackTimer = setTimeout(beginCountingPhase, 250);
      }
    }

    // 10. 阶段主循环：驱动进度条、圆球缩放动画以及从 2 开始的整数读秒
    function tickPhaseLoop(now) {
      if (!state.isRunning || state.isPaused || state.isSpeakingCue) return;

      const elapsedMs = now - state.phaseStartTime;
      const totalMs = state.phaseDuration * 1000;
      const progress = Math.min(elapsedMs / totalMs, 1);

      // 更新粗进度条宽度
      els.progressBar.style.width = `${(progress * 100).toFixed(2)}%`;

      // 更新呼吸圆球缩放动画
      const phaseKey = PHASE_ORDER[state.phaseIndex];
      // 使用正弦缓动让呼吸扩张和收缩更自然柔和
      const easeProgress = 0.5 - 0.5 * Math.cos(Math.PI * progress);

      if (phaseKey === 'inhale') {
        const scale = 0.62 + (1.05 - 0.62) * easeProgress;
        const haloScale = 0.65 + (1.12 - 0.65) * easeProgress;
        els.breathOrb.style.transform = `scale(${scale.toFixed(4)})`;
        els.breathHalo.style.transform = `scale(${haloScale.toFixed(4)})`;
      } else if (phaseKey === 'hold') {
        els.breathOrb.style.transform = 'scale(1.05)';
        els.breathHalo.style.transform = 'scale(1.12)';
      } else if (phaseKey === 'exhale') {
        const scale = 1.05 - (1.05 - 0.62) * easeProgress;
        const haloScale = 1.12 - (1.12 - 0.65) * easeProgress;
        els.breathOrb.style.transform = `scale(${scale.toFixed(4)})`;
        els.breathHalo.style.transform = `scale(${haloScale.toFixed(4)})`;
      }

      // 计算当前处于第几秒（第 1 秒内显示 1，满 1 秒进入第 2 秒时显示并朗读 "2"，以此类推直到总秒数）
      const totalIntSeconds = Math.round(state.phaseDuration);
      const currentSecond = Math.min(Math.floor(elapsedMs / 1000) + 1, totalIntSeconds);

      els.timerNumber.textContent = `${currentSecond}`;

      // 当到达第 2 秒及之后的整数秒时，语音播报数字（从 2 读到最后）
      if (currentSecond >= 2 && currentSecond > state.lastSpokenSecond) {
        state.lastSpokenSecond = currentSecond;
        if (els.toggleCountVoice.checked) {
          // 语速略微加快（1.25），确保快速读秒时数字之间清晰不重叠
          speakText(String(currentSecond), { rate: 1.25 });
        }
      }

      // 判断当前阶段是否结束
      if (progress >= 1) {
        const nextIndex = (state.phaseIndex + 1) % 3;
        // 如果刚完成“呼气”（index === 2），说明完成了一个完整 1:4:2 循环
        if (state.phaseIndex === 2) {
          state.cycles += 1;
          els.cycleCount.textContent = `${state.cycles}`;
        }
        startPhase(nextIndex);
      } else {
        state.rafId = requestAnimationFrame(tickPhaseLoop);
      }
    }

    // 11. 控制逻辑：开始 / 继续 / 暂停 / 重置
    function handleStartOrResume() {
      if (!('speechSynthesis' in window)) {
        showToast(I18N[state.lang].toastNoSpeech);
      }

      // 如果是从暂停状态恢复
      if (state.isPaused) {
        state.isPaused = false;
        state.isRunning = true;
        els.btnStart.disabled = true;
        els.btnStart.classList.add('opacity-50', 'pointer-events-none');
        els.btnPause.disabled = false;
        updateUI();

        if (state.isSpeakingCue) {
          // 如果暂停时刚好在播报阶段名称，重新从当前阶段开始
          startPhase(state.phaseIndex);
        } else {
          // 从暂停的时间点继续计时
          state.phaseStartTime = performance.now() - state.pausedElapsed;
          state.rafId = requestAnimationFrame(tickPhaseLoop);
        }
        return;
      }

      // 全新开始训练
      if (state.isRunning) return;
      state.isRunning = true;
      state.isPaused = false;

      els.btnStart.disabled = true;
      els.btnStart.classList.add('opacity-50', 'pointer-events-none');
      els.btnPause.disabled = false;
      updateUI();

      // 从第 0 阶段（吸气）开始
      startPhase(0);
    }

    function handlePause() {
      if (!state.isRunning || state.isPaused) return;
      state.isPaused = true;
      cancelAnimationFrame(state.rafId);
      clearTimeout(state.cueFallbackTimer);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (!state.isSpeakingCue) {
        state.pausedElapsed = performance.now() - state.phaseStartTime;
      }

      els.btnStart.disabled = false;
      els.btnStart.classList.remove('opacity-50', 'pointer-events-none');
      els.btnPause.disabled = true;
      updateUI();
    }

    function handleReset() {
      state.isRunning = false;
      state.isPaused = false;
      state.isSpeakingCue = false;
      state.phaseIndex = 0;
      state.cycles = 0;
      state.pausedElapsed = 0;

      cancelAnimationFrame(state.rafId);
      clearTimeout(state.cueFallbackTimer);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      // 重置 UI 元素状态
      els.cycleCount.textContent = '0';
      els.timerNumber.textContent = '0';
      els.progressBar.style.width = '0%';
      els.breathOrb.classList.remove('orb-holding');
      els.breathOrb.style.transform = 'scale(0.62)';
      els.breathHalo.style.transform = 'scale(0.65)';
      applyPhaseTheme('inhale');

      els.btnStart.disabled = false;
      els.btnStart.classList.remove('opacity-50', 'pointer-events-none');
      els.btnPause.disabled = true;

      updateUI();
    }

    // 12. 调节单位时间（滑块与微调按钮）
    function setUnitTime(val) {
      const clamped = Math.min(6.0, Math.max(1.0, Math.round(val * 2) / 2));
      state.unitTime = clamped;
      els.unitSlider.value = clamped;
      updateUI();
    }

    // 13. 事件监听器绑定
    // 语言切换按钮
    els.langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const selectedLang = btn.dataset.lang;
        if (selectedLang && I18N[selectedLang]) {
          state.lang = selectedLang;
          updateUI();
        }
      });
    });

    // 单位时间滑块拖动（实时更新）
    els.unitSlider.addEventListener('input', (e) => {
      setUnitTime(parseFloat(e.target.value));
    });

    // 单位时间减号 / 加号按钮
    els.btnUnitDec.addEventListener('click', () => {
      setUnitTime(state.unitTime - 0.5);
    });
    els.btnUnitInc.addEventListener('click', () => {
      setUnitTime(state.unitTime + 0.5);
    });

    // 开始 / 暂停 / 重置按钮
    els.btnStart.addEventListener('click', handleStartOrResume);
    els.btnPause.addEventListener('click', handlePause);
    els.btnReset.addEventListener('click', handleReset);

    // 测试语音按钮（用于测试三语发音及解锁 iOS Safari 音频上下文）
    els.btnTestVoice.addEventListener('click', () => {
      if (!('speechSynthesis' in window)) {
        showToast(I18N[state.lang].toastNoSpeech);
        return;
      }
      speakText(I18N[state.lang].testVoicePhrase, { rate: 1.05 });
    });

    // 页面初始化渲染
    window.addEventListener('DOMContentLoaded', () => {
      applyPhaseTheme('inhale');
      updateUI();
    });
  </script>
</body>
</html>
